schema: spec-driven

context: |
  Project: Change Triage - Portal de Validacion de Cambios en Produccion (greenfield, no code yet).
  Recommended stack: Python 3.x data pipeline (openpyxl -> data.json) + static vanilla HTML/CSS/JS SPA, no framework, no backend.
  Source of truth: ControlPases.xlsx -> workspace/output/data.json; frontend never reads Excel.
  Timezone: America/Lima. Theme: dark. Blueprint: Change-Triage-Blueprint-v1/.
  Artifacts in English per Language Domain Contract; direct replies in user's language.

strict_tdd: false

projects: []

testing:
  workspace_command: ""
  coverage_threshold: 0

rules:
  proposal:
    - Include rollback plan for risky changes
    - State SharePoint/Teams distribution impact when relevant
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Python only generates data.json; no backend runtime
    - Frontend is static SPA with no direct Excel access
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow blueprint structure (backend/, frontend/, workspace/, docs/)
      - Frontend never reads the Excel file
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
