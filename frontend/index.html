<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Triage — Portal de Validación de Cambios</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/drawer.js" defer></script>
  <script src="assets/js/search.js" defer></script>
  <script src="assets/js/filters.js" defer></script>
  <script src="assets/js/export.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <img class="logo" src="assets/images/BCP.png" alt="BCP logo">
    <div class="titles">
      <h1>Change Triage</h1>
      <p class="subtitle">Portal de Validación de Cambios en Producción</p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle"
      aria-pressed="true" aria-label="Tema actual: oscuro. Cambiar a tema claro.">&#9789; Oscuro</button>
    <img class="logo" src="assets/images/Kyndryl.png" alt="Kyndryl logo">
  </header>

  <main id="main">
    <p class="status" id="status" role="status" aria-live="polite">Loading change data…</p>

    <section class="toolbar" aria-label="Search, filter, and export">
      <input class="search" id="q" type="search" autocomplete="off"
        placeholder="Search ticket, app, recurso…"
        aria-label="Instant search across ticket, app, and recurso">
      <div class="filters">
        <div class="combo" data-combo="ticket">
          <input id="f-ticket" type="text" role="combobox" autocomplete="off"
            placeholder="Ticket" aria-label="Ticket filter"
            aria-expanded="false" aria-controls="f-ticket-list" aria-autocomplete="list">
          <ul class="combo-list" id="f-ticket-list" role="listbox"
            aria-label="Ticket suggestions" hidden></ul>
        </div>
        <div class="combo" data-combo="app">
          <input id="f-app" type="text" role="combobox" autocomplete="off"
            placeholder="App (Todas)" aria-label="App filter"
            aria-expanded="false" aria-controls="f-app-list" aria-autocomplete="list">
          <ul class="combo-list" id="f-app-list" role="listbox"
            aria-label="App suggestions" hidden></ul>
        </div>
        <select id="f-tipo" aria-label="Tipo filter">
          <option value="">Tipo (Todos)</option>
        </select>
        <div class="window-group" role="group" aria-label="Implementation window filter in Lima time">
          <div class="window-block">
            <span class="window-label" id="f-desde-label">Fec. Hora. Ini. Impl (Desde)</span>
            <div class="window-inputs" role="group" aria-labelledby="f-desde-label">
              <input id="f-desde-date" type="date" aria-label="Implementation window start date (Desde) in Lima time">
              <input id="f-desde-time" type="time" aria-label="Implementation window start time (Desde) in Lima time">
            </div>
          </div>
          <div class="window-block">
            <span class="window-label" id="f-hasta-label">Fec. Hora. Fin. Impl (Hasta)</span>
            <div class="window-inputs" role="group" aria-labelledby="f-hasta-label">
              <input id="f-hasta-date" type="date" aria-label="Implementation window end date (Hasta) in Lima time">
              <input id="f-hasta-time" type="time" aria-label="Implementation window end time (Hasta) in Lima time">
            </div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="export-csv">Export CSV</button>
        <button type="button" id="export-teams">Copy Teams summary</button>
        <button type="button" id="clear-filters" class="linklike">Limpiar filtros</button>
      </div>
      <textarea class="fallback" id="teams-fallback" rows="6" readonly hidden
        aria-label="Teams summary fallback for manual copy"></textarea>
    </section>

    <ul class="results" id="results" aria-label="Change results"></ul>

    <section class="empty" id="empty" hidden>
      <h2>No matching changes</h2>
      <p>No rows match the current view. Reset to show the full change list.</p>
      <button type="button" id="reset">Show all changes</button>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true"
      aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Change detail</h2>
      <button type="button" id="drawer-close" aria-label="Close detail">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <noscript><p class="status">This portal needs JavaScript to render change data.</p></noscript>
</body>
</html>
